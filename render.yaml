# ─────────────────────────────────────────────────────────────────────
#  AstroVision — Render Blueprint
#  Auto-deploys on every push to `main`.
#  Setup (one time):
#    1. Push this repo to GitHub.
#    2. In Render → "New +" → "Blueprint" → connect this repo.
#    3. Confirm the two services & disk; set NASA_API_KEY when prompted.
#    4. Every subsequent `git push origin main` triggers a redeploy.
# ─────────────────────────────────────────────────────────────────────

databases: []

services:
  # ── Backend: Django + DRF + PyTorch (Docker) ─────────────────────
  - type: web
    name: astrovision-backend
    runtime: docker
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        value: "sqlite:////tmp/db.sqlite3"
      - key: MEDIA_ROOT
        value: "/tmp/media"
      - key: MODEL_DIR
        value: "/tmp/model_artifacts"
      - key: NASA_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "https://astrovision.onrender.com"
      - key: WEB_CONCURRENCY
        value: "2"

  # ── Frontend: Vite + React static site (frontend-only blueprint) ──
  - type: web
    name: astrovision
    runtime: static
    branch: main
    autoDeploy: true
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://astrovision-backend.onrender.com/api"
      - key: VITE_NASA_API_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
