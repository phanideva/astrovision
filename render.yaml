# ─────────────────────────────────────────────────────────────────────
#  AstroVision — Render Blueprint
#  Auto-deploys on every push to `main`.
#  Setup (one time):
#    1. Push this repo to GitHub.
#    2. In Render → "New +" → "Blueprint" → connect this repo.
#    3. Confirm the two services & disk; set NASA_API_KEY when prompted.
#    4. Every subsequent `git push origin main` triggers a redeploy.
# ─────────────────────────────────────────────────────────────────────

databases: []

services:
  # ── Frontend: Vite + React static site (frontend-only blueprint) ──
  - type: web
    name: astrovision-frontend
    runtime: static
    branch: main
    autoDeploy: true
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: VITE_API_BASE_URL
        value: ""
      - key: VITE_NASA_API_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
